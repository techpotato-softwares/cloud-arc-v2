[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "forgearc-commerce"
version = "0.1.0"
description = "ForgeArc catalog, checkout, entitlements, and onboarding mail"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "sqlalchemy>=2.0.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
