components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        field:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Field
      required:
      - code
      - message
      title: ApiError
      type: object
    PaginationMeta:
      properties:
        page:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Page
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Limit
        total:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Total
        totalPages:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Totalpages
      title: PaginationMeta
      type: object
    ApiEnvelope:
      properties:
        success:
          title: Success
          type: boolean
        data:
          anyOf:
          - {}
          - type: 'null'
          default: null
          title: Data
        error:
          anyOf:
          - $ref: '#/components/schemas/ApiError'
          - type: 'null'
          default: null
        meta:
          anyOf:
          - $ref: '#/components/schemas/PaginationMeta'
          - type: 'null'
          default: null
      required:
      - success
      title: ApiEnvelope
      type: object
    LoginRequest:
      properties:
        username:
          title: Username
          type: string
        password:
          title: Password
          type: string
      required:
      - username
      - password
      title: LoginRequest
      type: object
    RefreshRequest:
      properties:
        refreshToken:
          title: Refreshtoken
          type: string
      required:
      - refreshToken
      title: RefreshRequest
      type: object
    CreatePermissionRequest:
      properties:
        permissionCode:
          title: Permissioncode
          type: string
        permissionName:
          title: Permissionname
          type: string
        description:
          default: ''
          title: Description
          type: string
        isActive:
          default: true
          title: Isactive
          type: boolean
      required:
      - permissionCode
      - permissionName
      title: CreatePermissionRequest
      type: object
    UpdatePermissionRequest:
      properties:
        permissionName:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Permissionname
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        isActive:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Isactive
      title: UpdatePermissionRequest
      type: object
    CreateRoleRequest:
      properties:
        roleName:
          title: Rolename
          type: string
        description:
          default: ''
          title: Description
          type: string
        isActive:
          default: true
          title: Isactive
          type: boolean
        permissionIds:
          items:
            type: integer
          title: Permissionids
          type: array
      required:
      - roleName
      title: CreateRoleRequest
      type: object
    UpdateRoleRequest:
      properties:
        roleName:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Rolename
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        isActive:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Isactive
        permissionIds:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          default: null
          title: Permissionids
      title: UpdateRoleRequest
      type: object
    CreateUserRequest:
      properties:
        username:
          title: Username
          type: string
        email:
          title: Email
          type: string
        password:
          title: Password
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Role
        roleId:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Roleid
        isActive:
          default: true
          title: Isactive
          type: boolean
      required:
      - username
      - email
      - password
      title: CreateUserRequest
      type: object
    UpdateUserRequest:
      properties:
        email:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Email
        password:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Password
        roleId:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Roleid
        isActive:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Isactive
      title: UpdateUserRequest
      type: object
    CreateDemoItemRequest:
      properties:
        title:
          title: Title
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        status:
          anyOf:
          - type: string
          - type: 'null'
          default: active
          title: Status
      required:
      - title
      title: CreateDemoItemRequest
      type: object
    UpdateDemoItemRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Description
        status:
