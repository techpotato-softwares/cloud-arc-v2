name: ForgeArc AI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check apps packages infra
      - run: uv run --package forgearc-ai-api pytest apps/api/tests
      - run: cd infra/cdk && pnpm dlx aws-cdk@2 synth AiStack-dev
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - run: bash scripts/smoke_aws.sh
