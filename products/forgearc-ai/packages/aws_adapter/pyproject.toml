[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgearc-ai-aws"
version = "1.0.0"
description = "ForgeArc AI AWS adapter. Licensed to the purchasing organization."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0",
  "forgearc-ai-core",
]

[tool.uv.sources]
forgearc-ai-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgearc_ai_aws*"]
