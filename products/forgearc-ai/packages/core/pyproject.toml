[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgearc-ai-core"
version = "1.0.0"
description = "ForgeArc AI provider contracts, policy, and retrieval core"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "PyJWT>=2.8.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgearc_ai*"]
