name: ForgeArc Node CI

on:
  push:
    paths:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --runInBand
        env:
          IS_LOCAL: 'true'
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          DB_HOST: localhost
          DB_NAME: forgearc
