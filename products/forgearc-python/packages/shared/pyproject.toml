[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgearc-python-shared"
version = "2.0.0"
description = "ForgeArc Python shared Lambda framework"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.0",
  "sqlmodel>=0.0.22",
  "pydantic>=2.0",
  "PyJWT>=2.8.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "boto3>=1.34.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "forgearc_shared*",
  "config*",
  "database*",
  "decorators*",
  "core*",
  "middleware*",
  "utils*",
]
