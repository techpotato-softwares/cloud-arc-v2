[project]
name = "forgearc-python-api"
version = "2.0.0"
description = "ForgeArc Python API host"
requires-python = ">=3.12"
dependencies = [
  "forgearc-python-shared",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",
  "pydantic-settings>=2.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.uv.sources]
forgearc-python-shared = { workspace = true }
