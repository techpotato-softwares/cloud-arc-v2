name: ForgeArc Python CI

on:
  push:
    paths:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check apps packages modules migrations infra
      - run: uv run --package forgearc-python-api pytest apps/api/tests
        env:
          IS_LOCAL: 'true'
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          DB_HOST: localhost
          DB_NAME: forgearc
