name: Node CloudArc CI
on:
  push:
    paths: ['node-cloud-arc/**']
  pull_request:
    paths: ['node-cloud-arc/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-cloud-arc/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm test
        env:
          IS_LOCAL: 'true'
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          DB_HOST: localhost
          DB_NAME: arcforge
