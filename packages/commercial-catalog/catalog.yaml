# Commercial catalog. Every plan is a one-time source license with 12 months of updates.
# ForgeArc AI is priced above Node and Python: it includes the Python platform patterns
# plus model providers, RAG, two cloud adapters, and AI cost and safety controls.
# apps/marketing/src/catalog.json is generated from this file with tooling/scripts/sync-catalog.py.

plans:
  - id: forgearc-node
    name: ForgeArc Node
    family: node
    tier: Production source
    recommended: true
    license_scope: One organization and its products
    updates: 12 months included
    summary: TypeScript serverless kit with auth, modules, and CDK.
    price_inr: 28999
    price_usd: 349
    checkout_enabled: true
    badge: Available
    artifacts: [node-kit, node-setup]
    includes:
      - TypeScript ForgeArc source
      - Platform auth, demo, files, and AI stub modules
      - 12 months of updates
      - Private setup guide

  - id: forgearc-python
    name: ForgeArc Python
    family: python
    tier: Production source
    recommended: true
    license_scope: One organization and its products
    updates: 12 months included
    summary: Python serverless kit with SQLAlchemy, Alembic, and CDK.
    price_inr: 32999
    price_usd: 399
    checkout_enabled: true
    badge: Available
    artifacts: [python-kit, python-setup]
    includes:
      - ForgeArc Python source
      - SQLAlchemy, SQLModel, and Alembic
      - Platform auth, demo, files, and AI stub modules
      - 12 months of updates
      - Private setup guide

  - id: forgearc-bundle
    name: ForgeArc Bundle
    family: bundle
    tier: Node + Python
    recommended: true
    license_scope: One organization and its products
    updates: 12 months included
    summary: Node and Python kits with one license.
    price_inr: 49999
    price_usd: 599
    checkout_enabled: true
    badge: Available
    artifacts: [node-kit, node-setup, python-kit, python-setup]
    includes:
      - Both ForgeArc kits
      - Shared API contract
      - 12 months of updates

  - id: forgearc-ai
    name: ForgeArc AI
    family: ai
    tier: AWS + GCP source
    recommended: false
    license_scope: One organization and its products
    updates: 12 months included
    summary: Production AI backend with chat, RAG, and decisions on AWS or GCP.
    price_inr: 44999
    price_usd: 549
    checkout_enabled: true
    badge: Available
    artifacts: [ai-core, aws-adapter, gcp-adapter, ai-setup]
    includes:
      - Streaming chat, RAG ingestion, and citations
      - Jev typed decisions with human-review thresholds
      - AWS adapter with CDK and GCP adapter with Terraform
      - Budgets, rate limits, moderation, and audit logs
      - 12 months of updates

  - id: forgearc-ai-pro
    name: ForgeArc AI Pro
    family: ai
    tier: Agents + evaluation
    recommended: true
    license_scope: One organization and its products
    updates: 12 months included
    summary: Everything in ForgeArc AI plus agents, approvals, and evaluation.
    price_inr: 69999
    price_usd: 849
    checkout_enabled: true
    badge: Available
    artifacts: [ai-core, aws-adapter, gcp-adapter, ai-agents, ai-setup]
    includes:
      - Everything in ForgeArc AI
      - Tool-calling agents on a LangGraph-compatible graph
      - Human-approval APIs for risky tool calls
      - Multi-agent supervisor
      - RAG evaluation with a RAGAS bridge and a cost dashboard API

  - id: suite
    name: ForgeArc Suite
    family: bundle
    tier: Node + Python + AI Pro
    recommended: false
    license_scope: One organization and its products
    updates: 12 months included
    summary: Every ForgeArc kit under one license.
    price_inr: 99999
    price_usd: 1199
    checkout_enabled: true
    badge: Available
    artifacts: [node-kit, node-setup, python-kit, python-setup, ai-core, aws-adapter, gcp-adapter, ai-agents, ai-setup]
    includes:
      - ForgeArc Node
      - ForgeArc Python
      - ForgeArc AI Pro
      - 12 months of updates
