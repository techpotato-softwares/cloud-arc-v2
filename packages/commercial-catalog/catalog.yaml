# Commercial catalog.
# The AWS and GCP starter plans are open.
# Higher AI tiers stay closed until their support and license terms ship.
# ForgeArc Node, Python, and the bundle match docs/PRICING.md and can be purchased now.
# INR amounts for those three SKUs are the India checkout prices for the current kits.

plans:
  - id: forgearc-node
    name: ForgeArc Node
    family: node
    tier: Production source
    recommended: true
    license_scope: One organization and its products
    updates: 12 months included
    summary: TypeScript serverless kit with auth, modules, and CDK.
    price_inr: 28999
    price_usd: 349
    checkout_enabled: true
    badge: Available
    artifacts: [node-kit, node-setup]
    includes:
      - TypeScript ForgeArc source
      - Platform auth, demo, files, and AI stub modules
      - 12 months of updates
      - Private setup guide

  - id: forgearc-python
    name: ForgeArc Python
    family: python
    tier: Production source
    recommended: true
    license_scope: One organization and its products
    updates: 12 months included
    summary: Python serverless kit with SQLAlchemy, Alembic, and CDK.
    price_inr: 32999
    price_usd: 399
    checkout_enabled: true
    badge: Available
    artifacts: [python-kit, python-setup]
    includes:
      - ForgeArc Python source
      - SQLAlchemy, SQLModel, and Alembic
      - Platform auth, demo, files, and AI stub modules
      - 12 months of updates
      - Private setup guide

  - id: forgearc-bundle
    name: ForgeArc Bundle
    family: bundle
    tier: Node + Python
    recommended: true
    license_scope: One organization and its products
    updates: 12 months included
    summary: Node and Python kits with one license.
    price_inr: 49999
    price_usd: 599
    checkout_enabled: true
    badge: Available
    artifacts: [node-kit, node-setup, python-kit, python-setup]
    includes:
      - Both ForgeArc kits
      - Shared API contract
      - 12 months of updates

  - id: free
    name: Free
    family: ai
    tier: Evaluate
    license_scope: Local evaluation
    updates: Public core updates
    summary: Public CLI and core for local evaluation.
    price_inr: 0
    price_usd: 0
    checkout_enabled: false
    badge: Local evaluation
    artifacts: [cli-core]
    includes:
      - CLI and provider-agnostic core
      - Local development with the OpenAI path

  - id: starter-aws
    name: Starter AWS
    family: ai
    tier: AWS source
    recommended: true
    license_scope: One organization and its products
    updates: Current AWS MVP updates
    excludes: [GCP adapter, Multi-project agency license]
    summary: ForgeArc AI with the AWS adapter.
    price_inr: 3999
    price_usd: 48
    checkout_enabled: true
    badge: Available
    artifacts: [ai-core, aws-adapter, ai-setup]
    includes:
      - ForgeArc AI core
      - AWS adapter and docs
      - Bedrock, S3, and SQS path

  - id: starter-gcp
    name: Starter GCP
    family: ai
    tier: GCP source
    license_scope: One organization and its products
    updates: Current GCP edition updates
    summary: ForgeArc AI with the GCP adapter.
    price_inr: 3999
    price_usd: 48
    checkout_enabled: true
    badge: Available
    artifacts: [ai-core, gcp-adapter, ai-setup]
    includes:
      - ForgeArc AI core
      - GCP adapter, Terraform, and docs
      - Vertex AI, Cloud Storage, Pub/Sub, Firestore, and AlloyDB

  - id: professional
    name: Professional
    family: ai
    tier: Multi-cloud
    license_scope: One organization and its products
    updates: Lifetime updates
    summary: Both cloud adapters, updates, and support allowance.
    price_inr: 9999
    price_usd: 120
    checkout_enabled: false
    badge: Coming with GCP
    artifacts: [ai-core, aws-adapter, gcp-adapter, ai-setup, support-allowance]
