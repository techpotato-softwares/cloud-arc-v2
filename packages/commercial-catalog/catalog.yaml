  - id: enterprise
    name: Enterprise
    family: ai
    tier: Team + SLA
    license_scope: Team license
    updates: Contract SLA
    summary: Team license, SLA, and workshop.
    price_inr: 79999
    price_usd: 960
    checkout_enabled: false
    badge: Coming with GCP
    artifacts: [ai-core, aws-adapter, gcp-adapter, ai-setup, enterprise-sla]
