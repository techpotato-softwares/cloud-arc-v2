name: Node CloudArc CI

on:
  push:
    paths:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci || npm install
      - name: Test
        run: npm test
        env:
          IS_LOCAL: 'true'
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          DB_HOST: localhost
          DB_NAME: arcforge
