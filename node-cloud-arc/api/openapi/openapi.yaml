openapi: 3.1.0
info:
  title: ArcForge API
  version: 0.1.0
  description: Generated from Zod schemas and @Controller route metadata
servers:
  - url: http://localhost:4000
    description: Express dev server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
      required:
        - code
        - message
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ApiEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          $ref: "#/components/schemas/ApiError"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - success
    UserInfo:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        roleName:
          type: string
          nullable: true
        roleId:
          type: integer
          nullable: true
        permissions:
          type: array
          items:
            type: string
      required:
        - userId
        - username
        - email
        - permissions
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
        refreshExpiresIn:
          type: number
        user:
          $ref: "#/components/schemas/UserInfo"
      required:
        - success
        - message
        - accessToken
        - refreshToken
        - expiresIn
        - refreshExpiresIn
        - user
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - username
        - password
    RefreshResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
        refreshExpiresIn:
          type: number
      required:
        - success
        - message
        - accessToken
        - refreshToken
        - expiresIn
        - refreshExpiresIn
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    UserResponse:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
        roleId:
          type: integer
        isActive:
          type: boolean
      required:
        - userId
        - username
        - email
        - role
        - isActive
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
        roleId:
          type: integer
        isActive:
          type: boolean
        createdById:
          type: integer
        updatedById:
          type: integer
      required:
        - username
        - email
        - password
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
        roleId:
          type: integer
        isActive:
          type: boolean
        updatedById:
          type: integer
    CreateRoleRequest:
      type: object
      properties:
        roleName:
          type: string
          minLength: 1
        description:
          type: string
        isActive:
          type: boolean
        permissionIds:
          type: array
          items:
            type: integer
        createdById:
          type: integer
        updatedById:
          type: integer
      required:
        - roleName
    UpdateRoleRequest:
      type: object
      properties:
        roleName:
          type: string
          minLength: 1
        description:
          type: string
        isActive:
          type: boolean
        permissionIds:
          type: array
          items:
            type: integer
        updatedById:
          type: integer
    CreatePermissionRequest:
      type: object
      properties:
        permissionCode:
          type: string
          minLength: 1
        permissionName:
          type: string
          minLength: 1
        description:
          type: string
        isActive:
          type: boolean
        createdById:
          type: integer
        updatedById:
          type: integer
      required:
        - permissionCode
        - permissionName
    UpdatePermissionRequest:
      type: object
      properties:
        permissionCode:
          type: string
          minLength: 1
        permissionName:
          type: string
          minLength: 1
        description:
          type: string
        isActive:
          type: boolean
        updatedById:
          type: integer
  parameters: {}
